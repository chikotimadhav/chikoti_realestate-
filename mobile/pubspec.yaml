name: estatehub
description: "EstateHub - Premium Real Estate & Land Investment Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & Data
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Deep Linking & External Actions (Call & WhatsApp)
  url_launcher: ^6.3.0

  # Typography & Media
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  image_picker: ^1.1.2

  # UI Micro-interactions
  flutter_staggered_animations: ^1.1.1

  # Icons & Native Look
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
